name: Docker Image CI on merge to master

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ["master"]

env:
  IMAGE_NAME: ai-goofish
  BASE_IMAGE_NAME: ai-goofish-base

jobs:
  build-base:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base_image: ${{ steps.prepare.outputs.base_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: prepare
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          BASE_IMAGE_NAME: ${{ env.BASE_IMAGE_NAME }}
        run: |
          set -euo pipefail

          owner_lower=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          base_image="ghcr.io/${owner_lower}/${BASE_IMAGE_NAME}:latest"

          base_tags=(
            "${base_image}"
            "ghcr.io/${owner_lower}/${BASE_IMAGE_NAME}:${GITHUB_SHA}"
          )

          {
            echo "base_image=${base_image}"
            echo 'base_tags<<EOF'
            printf '%s\n' "${base_tags[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.prepare.outputs.base_tags }}
          # mode=max 会把 Chromium 和 apt 中间层打进同一条 cache。amd64+arm64 容易超过
          # GitHub Actions 单条 cache 10GB 上限，reserve 失败会取消已经构建好的镜像推送。
          cache-from: type=gha,scope=ai-goofish-base-docker
          cache-to: type=gha,scope=ai-goofish-base-docker,mode=min,ignore-error=true

  build-and-push:
    needs: build-base
    if: ${{ needs.build-base.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare release tags
        id: prepare
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          owner_lower=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')

          app_tags=(
            "ghcr.io/${owner_lower}/${IMAGE_NAME}:latest"
            "ghcr.io/${owner_lower}/${IMAGE_NAME}:${GITHUB_SHA}"
          )

          {
            echo 'app_tags<<EOF'
            printf '%s\n' "${app_tags[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.base_image }}
          tags: ${{ steps.prepare.outputs.app_tags }}
          cache-from: type=gha,scope=ai-goofish-release-docker
          cache-to: type=gha,scope=ai-goofish-release-docker,mode=min,ignore-error=true

  build-browser:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Prepare browser image tags
        id: browser-tags
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lower=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lower}/ai-goofish-browser" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native browser for startup test
        uses: docker/build-push-action@v5
        with:
          context: ./docker/browser
          file: ./docker/browser/Dockerfile
          load: true
          tags: ai-goofish-browser:smoke
          cache-from: type=gha,scope=ai-goofish-browser
      - name: Test browser desktop and CDP before publishing
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_PASSWORD="$(openssl rand -hex 24)"
          export BROWSER_PASSWORD
          echo "::add-mask::${BROWSER_PASSWORD}"
          trap 'docker rm -f browser-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name browser-smoke --cap-drop ALL \
            --security-opt no-new-privileges:true --shm-size=1g \
            -e BROWSER_PASSWORD -e BROWSER_START_URL=about:blank \
            -p 127.0.0.1:17900:7900 -p 127.0.0.1:19223:9223 ai-goofish-browser:smoke
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:19223/json/version >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:19223/json/version >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:17900/vnc.html)" = 401
          curl --silent --fail --user "browser:${BROWSER_PASSWORD}" http://127.0.0.1:17900/vnc.html >/dev/null
      - uses: docker/build-push-action@v5
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
        with:
          context: ./docker/browser
          file: ./docker/browser/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.browser-tags.outputs.image }}:latest
            ${{ steps.browser-tags.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=ai-goofish-browser
          cache-to: type=gha,scope=ai-goofish-browser,mode=min,ignore-error=true
