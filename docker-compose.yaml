services:
  app:
    image: ${APP_IMAGE:-ghcr.io/qfgood/ai-goofish:latest}
    container_name: ai-goofish-monitor-app
    pull_policy: always
    init: true
    ports:
      - "${APP_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8000
      APP_DATABASE_FILE: /app/data/app.sqlite3
      BROWSER_MODE: remote
      BROWSER_CDP_URL: http://browser:9223
      BROWSER_PUBLIC_URL: ${BROWSER_PUBLIC_URL:-http://192.168.9.202:7900/vnc.html?autoconnect=1&resize=remote}
    depends_on:
      browser:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./state:/app/state
      - ./config.json:/app/config.json
      - ./jsonl:/app/jsonl
      - ./logs:/app/logs
      - ./images:/app/images
      - ./price_history:/app/price_history
    restart: unless-stopped

  browser:
    image: ${BROWSER_IMAGE:-ghcr.io/qfgood/ai-goofish-browser:latest}
    build: ./docker/browser
    init: true
    ports:
      - "${BROWSER_PORT:-7900}:7900"
    expose:
      - "9223"
    volumes:
      - browser-profile:/config
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  browser-profile:
